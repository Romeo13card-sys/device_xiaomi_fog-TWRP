
name: AERA Recovery 16.0 - Redmi 10C (fog)

on:
  workflow_dispatch:
    inputs:
      sync_jobs:
        description: "Repo sync jobs"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "4"]
      build_jobs:
        description: "Build jobs"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "4"]

permissions:
  contents: read

concurrency:
  group: aera-fog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AERA 16.0 for fog
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      ANDROID_DIR: ${{ github.workspace }}/android
      DEVICE_DIR: device/xiaomi/fog
      USE_CCACHE: "0"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: fog-tree
          persist-credentials: false

      - name: Free disk space
        run: |
          set -eo pipefail

          echo "=== BEFORE CLEANUP ==="
          df -h
          free -h

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "=== AFTER CLEANUP ==="
          df -h

      - name: Install build dependencies
        run: |
          set -eo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            git git-lfs curl wget unzip zip \
            lz4 zstd bc bison flex build-essential \
            gperf libssl-dev libxml2-utils \
            xsltproc libncurses-dev \
            python3 python3-pip \
            ccache rsync openjdk-17-jdk

          mkdir -p "$HOME/bin"

          curl -fLsS \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize AERA 16.0
        run: |
          set -eo pipefail

          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"

          "$HOME/bin/repo" init \
            --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0

          "$HOME/bin/repo" manifest \
            -o "$GITHUB_WORKSPACE/aera-manifest.xml"

          echo "Manifest initialized successfully"

      - name: Sync AERA sources
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"
          export PYTHONUNBUFFERED=1

          echo "=== STARTING REPO SYNC ==="
          echo "Jobs: ${{ inputs.sync_jobs }}"
          date -u

          sync_success=0

          for attempt in 1 2 3; do
            echo "=== SYNC ATTEMPT $attempt ==="

            set +e

            "$HOME/bin/repo" sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --jobs="${{ inputs.sync_jobs }}" \
              --jobs-network="${{ inputs.sync_jobs }}" \
              --jobs-checkout=2 \
              --no-progress \
              2>&1 | tee -a "$GITHUB_WORKSPACE/repo-sync.log"

            status=${PIPESTATUS[0]}

            set -e

            if [ "$status" -eq 0 ]; then
              sync_success=1
              break
            fi

            echo "Sync failed: exit code $status"
            df -h

            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          if [ "$sync_success" -ne 1 ]; then
            echo "::error::Repo sync failed"
            exit 1
          fi

          echo "=== REPO SYNC COMPLETED ==="

          test -f build/envsetup.sh || {
            echo "::error::Android build system missing"
            exit 1
          }

          echo "=== SOURCE SIZE ==="
          du -sh "$ANDROID_DIR" || true

          echo "=== FREE DISK SPACE ==="
          df -h

      - name: Install device tree
        run: |
          set -eo pipefail

          mkdir -p "$ANDROID_DIR/$DEVICE_DIR"

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="scripts" \
            "$GITHUB_WORKSPACE/fog-tree/" \
            "$ANDROID_DIR/$DEVICE_DIR/"

          test -f "$ANDROID_DIR/$DEVICE_DIR/BoardConfig.mk"
          test -f "$ANDROID_DIR/$DEVICE_DIR/AndroidProducts.mk"
          test -f "$ANDROID_DIR/$DEVICE_DIR/twrp_fog.mk"

          echo "Device tree installed successfully"

      - name: Prepare OrangeFox kernel
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"

          bash \
            "$GITHUB_WORKSPACE/fog-tree/scripts/prepare-prebuilt.sh" \
            2>&1 | tee "$GITHUB_WORKSPACE/prebuilt.log"

          test -s "$DEVICE_DIR/prebuilt/Image.gz"

          ls -lh "$DEVICE_DIR/prebuilt/Image.gz"

      - name: Build AERA Recovery
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"

          # Do not enable nounset for Android envsetup.
          source build/envsetup.sh

          lunch twrp_fog-bp2a-eng

          echo "=== BUILD STARTED ==="
          date -u

          set +e

          m -j"${{ inputs.build_jobs }}" \
            adbd recoveryimage \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          result=${PIPESTATUS[0]}

          set -e

          echo "=== BUILD FINISHED ==="
          date -u
          echo "Exit code: $result"

          exit "$result"

      - name: Collect recovery images
        if: success()
        run: |
          set -eo pipefail

          PRODUCT_OUT="$ANDROID_DIR/out/target/product/fog"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for img in boot.img recovery.img vendor_boot.img; do
            if [ -s "$PRODUCT_OUT/$img" ]; then
              cp -v \
                "$PRODUCT_OUT/$img" \
                "$GITHUB_WORKSPACE/artifacts/"
            fi
          done

          if ! compgen -G \
            "$GITHUB_WORKSPACE/artifacts/*.img" > /dev/null; then
            echo "::error::No recovery image generated"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum ./*.img > SHA256SUMS
          ls -lh

      - name: Upload recovery images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-16.0-fog-UNTESTED
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Final diagnostics
        if: always()
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== MEMORY ==="
          free -h

          echo "=== LOGS ==="
          ls -lh \
            "$GITHUB_WORKSPACE/"*.log 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-fog-build-logs
          path: |
            repo-sync.log
            prebuilt.log
            build.log
            aera-manifest.xml
          if-no-files-found: ignore
          retention-days: 7
