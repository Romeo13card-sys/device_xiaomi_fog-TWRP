name: AERA Recovery 16.0 - Redmi 10C (fog)

on:
  workflow_dispatch:
    inputs:
      sync_jobs:
        description: Parallel repo sync jobs
        required: true
        default: '4'
        type: choice
        options: ['1', '2', '4']
      build_jobs:
        description: Parallel build jobs
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4']
      notification_mode:
        description: Telegram notification mode
        required: true
        default: quiet
        type: choice
        options:
          - quiet
          - loud

permissions:
  contents: read

concurrency:
  group: aera-fog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AERA 16.0 for fog
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      ANDROID_DIR: ${{ github.workspace }}/android
      DEVICE_DIR: device/xiaomi/fog
      SYNC_JOBS: ${{ inputs.sync_jobs }}
      BUILD_JOBS: ${{ inputs.build_jobs }}
      USE_CCACHE: '0'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GIT_TERMINAL_PROMPT: '0'
      GOMAXPROCS: '2'
      GOGC: '50'
      GOMEMLIMIT: 10GiB

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: fog-tree
          persist-credentials: false

      - name: Notify Telegram - build started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_QUIET: ${{ inputs.notification_mode == 'quiet' }}
        run: |
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            MESSAGE="🚀 AERA Recovery 16.0 (fog)
          Build started!
          Branch: ${GITHUB_REF_NAME}
          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            curl -fsS --retry 2 --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              -d "disable_notification=${NOTIFY_QUIET}" \
              > /dev/null
          fi

      - name: Clean runner disk
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Install build tools
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git git-lfs curl wget aria2 python3 python-is-python3 \
            unzip zip bc bison flex build-essential gperf \
            gcc-multilib g++-multilib lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool lz4 zstd libncurses-dev libssl-dev \
            libxml2 libxml2-utils xsltproc rsync lzop pngcrush \
            squashfs-tools schedtool imagemagick ccache util-linux

          mkdir -p "$HOME/bin"
          curl -fLsS --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          "$HOME/bin/repo" version
          df -h /

      - name: Set up OpenJDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '11'

      - name: Initialize AERA 16.0 sources
        run: |
          set -eo pipefail
          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"
          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0
          "$HOME/bin/repo" manifest -o "$GITHUB_WORKSPACE/aera-manifest.xml"

      - name: Sync sources with live progress
        run: |
          set -eo pipefail
          cd "$ANDROID_DIR"
          export PYTHONUNBUFFERED=1

          for attempt in 1 2; do
            echo "=== repo sync attempt ${attempt}/2; jobs=${SYNC_JOBS} ==="
            set +e
            script -q -e -c \
              "$HOME/bin/repo sync -c --no-clone-bundle --no-tags -j${SYNC_JOBS}" \
              /dev/null 2>&1 | tee -a "$GITHUB_WORKSPACE/repo-sync.log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "::error::repo sync failed: ${status}"
              exit "$status"
            fi
            sleep 15
          done

          test -f build/envsetup.sh
          test -f system/tools/mkbootimg/unpack_bootimg.py
          df -h /

      - name: Install Redmi 10C fog device tree
        run: |
          set -eo pipefail
          mkdir -p "$ANDROID_DIR/$DEVICE_DIR"
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' \
            "$GITHUB_WORKSPACE/fog-tree/" "$ANDROID_DIR/$DEVICE_DIR/"

          for f in BoardConfig.mk AndroidProducts.mk twrp_fog.mk device.mk; do
            test -f "$ANDROID_DIR/$DEVICE_DIR/$f" || {
              echo "::error::Missing device file $f"
              exit 1
            }
          done

          test -f "$ANDROID_DIR/vendor/twrp/config/common.mk"

      - name: Prepare known-working OrangeFox kernel
        run: |
          set -eo pipefail
          cd "$ANDROID_DIR"
          bash "$GITHUB_WORKSPACE/fog-tree/scripts/prepare-prebuilt.sh" \
            2>&1 | tee "$GITHUB_WORKSPACE/prebuilt.log"
          test -s "$DEVICE_DIR/prebuilt/Image.gz"
          ls -lh "$DEVICE_DIR/prebuilt/Image.gz"

      - name: Choose safe swap size
        id: swap
        run: |
          set -eo pipefail
          available_mb=$(df -Pm / | awk 'NR==2 {print $4}')
          echo "Free disk before swap: ${available_mb} MiB"

          if [ "$available_mb" -ge 59392 ]; then
            swap_gb=30
          elif [ "$available_mb" -ge 39936 ]; then
            swap_gb=12
          elif [ "$available_mb" -ge 30720 ]; then
            swap_gb=8
          else
            swap_gb=0
          fi

          echo "swap_gb=$swap_gb" >> "$GITHUB_OUTPUT"
          echo "Selected swap size: ${swap_gb} GiB"

      - name: Set swap space
        if: steps.swap.outputs.swap_gb != '0'
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: ${{ steps.swap.outputs.swap_gb }}

      - name: Check runner resources
        run: |
          nproc
          free -h
          swapon --show || true
          df -h /

      - name: Build AERA recovery for fog
        run: |
          set -eo pipefail
          cd "$ANDROID_DIR"
          echo "=== fog / recoveryimage / ${BUILD_JOBS} build jobs ==="

          (
            while true; do
              {
                echo "=== RESOURCES $(date -u +'%H:%M:%S UTC') ==="
                free -h
                df -h /
                ps -eo pid,rss,comm --sort=-rss | head -n 8 || true
              } 2>&1 | tee -a "$GITHUB_WORKSPACE/resources.log"
              sleep 45
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          set +e
          (
            set -eo pipefail
            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_fog-bp2a-eng
            m -j"$BUILD_JOBS" adbd recoveryimage
          ) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          result=${PIPESTATUS[0]}
          set -e

          kill "$monitor_pid" 2>/dev/null || true
          echo "Build exit code: $result"
          exit "$result"

      - name: Collect recovery images and hashes
        if: success()
        run: |
          set -eo pipefail
          out="$ANDROID_DIR/out/target/product/fog"
          dst="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$dst"

          for img in boot.img recovery.img vendor_boot.img; do
            if [ -s "$out/$img" ]; then
              cp -v "$out/$img" "$dst/"
            fi
          done

          find "$out" -maxdepth 1 -type f \
            \( -name 'AERA-R*.img' -o -name 'AERA-R*.zip' \) \
            -exec cp -v {} "$dst/" \;

          compgen -G "$dst/*.img" >/dev/null || {
            echo '::error::No recovery image was generated'
            exit 1
          }

          cd "$dst"
          find . -maxdepth 1 -type f \( -name '*.img' -o -name '*.zip' \) \
            -print0 | xargs -0 -r sha256sum > SHA256SUMS
          ls -lh

      - name: Upload recovery images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-16.0-fog-UNTESTED
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Final resource diagnostics
        if: always()
        run: |
          df -h /
          free -h
          swapon --show || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-fog-build-logs
          path: |
            aera-manifest.xml
            repo-sync.log
            prebuilt.log
            build.log
            resources.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Telegram - build result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_QUIET: ${{ inputs.notification_mode == 'quiet' }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not configured"
            exit 0
          fi

          case "$BUILD_STATUS" in
            success)
              MESSAGE="✅ AERA Recovery 16.0 (fog)
          Build completed successfully!
          Download artifacts in GitHub Actions." ;;
            failure)
              MESSAGE="❌ AERA Recovery 16.0 (fog)
          Build failed. Check GitHub Actions logs." ;;
            *)
              MESSAGE="⚠️ AERA Recovery 16.0 (fog)
          Build status: ${BUILD_STATUS}" ;;
          esac

          MESSAGE="${MESSAGE}
          https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -fsS --retry 2 --max-time 20 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_notification=${NOTIFY_QUIET}" \
            > /dev/null
