
name: AERA Recovery 16.0 - Redmi 10C (fog)

on:
  workflow_dispatch:
    inputs:
      sync_jobs:
        description: Parallel repo sync jobs
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4']
      build_jobs:
        description: Parallel build jobs
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4']

permissions:
  contents: read

concurrency:
  group: aera-fog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AERA 16.0 for fog
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      ANDROID_DIR: ${{ github.workspace }}/android
      DEVICE_DIR: device/xiaomi/fog
      SYNC_JOBS: ${{ inputs.sync_jobs }}
      BUILD_JOBS: ${{ inputs.build_jobs }}
      USE_CCACHE: '0'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Checkout fog device tree
        uses: actions/checkout@v4
        with:
          path: fog-tree
          persist-credentials: false

      - name: Prepare disk space
        run: |
          set -eo pipefail
          echo '=== Runner resources before cleanup ==='
          df -h /
          free -h

          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet /usr/local/share/powershell \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo '=== Available disk space ==='
          df -h /

      - name: Install build tools
        run: |
          set -eo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            git git-lfs curl wget unzip zip \
            lz4 zstd bc bison flex build-essential \
            gperf libssl-dev libxml2-utils xsltproc \
            libncurses-dev python3 python3-pip rsync \
            openjdk-17-jdk util-linux

          mkdir -p "$HOME/bin"

          curl -fLsS --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          "$HOME/bin/repo" version
          command -v script

      - name: Initialize AERA 16.0 manifest
        run: |
          set -eo pipefail

          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"

          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0

          "$HOME/bin/repo" manifest \
            -o "$GITHUB_WORKSPACE/aera-manifest.xml"

          echo 'Manifest initialized.'

      - name: Repo sync - live progress
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"
          export PYTHONUNBUFFERED=1

          echo "=== Syncing AERA 16.0 with ${SYNC_JOBS} jobs ==="
          echo "Started: $(date -u)"

          # Allocate a terminal to display normal repo progress.
          # Preserve repo's exit status and save the live output.

          for attempt in 1 2; do
            echo "=== repo sync attempt ${attempt}/2 ==="

            set +e

            script -q -e -c \
              "$HOME/bin/repo sync -c --no-clone-bundle --no-tags -j${SYNC_JOBS}" \
              /dev/null 2>&1 | tee -a "$GITHUB_WORKSPACE/repo-sync.log"

            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo '=== repo sync completed successfully ==='
              break
            fi

            echo "repo sync failed with code ${status}"

            if [ "$attempt" -eq 2 ]; then
              echo '::error::repo sync failed after two attempts'
              exit "$status"
            fi

            sleep 15
          done

          test -f build/envsetup.sh || {
            echo '::error::Android build/envsetup.sh was not synced'
            exit 1
          }

          test -f system/tools/mkbootimg/unpack_bootimg.py || {
            echo '::error::mkbootimg source was not synced'
            exit 1
          }

          df -h /

      - name: Install fog device tree
        run: |
          set -eo pipefail

          mkdir -p "$ANDROID_DIR/$DEVICE_DIR"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            "$GITHUB_WORKSPACE/fog-tree/" \
            "$ANDROID_DIR/$DEVICE_DIR/"

          for file in \
            BoardConfig.mk \
            AndroidProducts.mk \
            twrp_fog.mk \
            device.mk; do

            test -f "$ANDROID_DIR/$DEVICE_DIR/$file" || {
              echo "::error::Missing device tree file: $file"
              exit 1
            }
          done

          test -f "$ANDROID_DIR/vendor/twrp/config/common.mk"

          echo 'Device tree installed.'

      - name: Extract kernel from working OrangeFox image
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"

          bash \
            "$GITHUB_WORKSPACE/fog-tree/scripts/prepare-prebuilt.sh" \
            2>&1 | tee "$GITHUB_WORKSPACE/prebuilt.log"

          test -s "$DEVICE_DIR/prebuilt/Image.gz" || {
            echo '::error::OrangeFox kernel extraction failed'
            exit 1
          }

          ls -lh "$DEVICE_DIR/prebuilt/Image.gz"

      - name: Build AERA Recovery
        run: |
          set -eo pipefail

          cd "$ANDROID_DIR"

          echo "=== Building AERA 16.0 with ${BUILD_JOBS} jobs ==="

          # No set -u: Android envsetup uses unset variables.
          # Capture lunch failures and compiler errors.

          (
            set -eo pipefail

            source build/envsetup.sh

            lunch twrp_fog-bp2a-eng

            m -j"$BUILD_JOBS" adbd recoveryimage

          ) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo '=== AERA build completed successfully ==='

      - name: Collect images and SHA256
        if: success()
        run: |
          set -eo pipefail

          PRODUCT_OUT="$ANDROID_DIR/out/target/product/fog"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          found=0

          for img in boot.img recovery.img vendor_boot.img; do
            if [ -s "$PRODUCT_OUT/$img" ]; then
              cp -v \
                "$PRODUCT_OUT/$img" \
                "$GITHUB_WORKSPACE/artifacts/"

              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo '::error::Build reported success, but no image was produced'
            exit 1
          fi

          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum ./*.img > SHA256SUMS
          )

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload AERA recovery images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-16.0-fog-UNTESTED
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Final resource diagnostics
        if: always()
        run: |
          df -h /
          free -h
          ls -lh "$GITHUB_WORKSPACE/"*.log 2>/dev/null || true

      - name: Upload logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-fog-build-logs
          path: |
            repo-sync.log
            prebuilt.log
            build.log
            aera-manifest.xml
          if-no-files-found: ignore
          retention-days: 7
