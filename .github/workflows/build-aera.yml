name: AERA 16.0 - Redmi 10C (fog)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AERA Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      ANDROID_DIR: ${{ github.workspace }}/android
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: "0"

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: fog-tree
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail

          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "=== Disk after cleanup ==="
          df -h
          free -h

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            git git-lfs curl wget unzip zip \
            lz4 zstd bc bison flex build-essential \
            gperf libssl-dev libxml2-utils xsltproc \
            libncurses-dev python3 python3-pip \
            ccache rsync openjdk-17-jdk

          mkdir -p "$HOME/bin"

          curl -fLsS \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync AERA 16.0 sources
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"

          "$HOME/bin/repo" init \
            --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0

          "$HOME/bin/repo" sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            -j2 \
            2>&1 | tee "$GITHUB_WORKSPACE/repo-sync.log"

          echo "=== Disk usage after sync ==="
          df -h

      - name: Install device tree
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_DIR/device/xiaomi/fog"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            "$GITHUB_WORKSPACE/fog-tree/" \
            "$ANDROID_DIR/device/xiaomi/fog/"

          test -f \
            "$ANDROID_DIR/device/xiaomi/fog/BoardConfig.mk"

      - name: Prepare OrangeFox kernel
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          bash \
            "$GITHUB_WORKSPACE/fog-tree/scripts/prepare-prebuilt.sh" \
            2>&1 | tee "$GITHUB_WORKSPACE/prebuilt.log"

      - name: Build AERA Recovery
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_fog-bp2a-eng

          set +e
          m -j2 adbd recoveryimage \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          result=${PIPESTATUS[0]}
          set -e

          exit "$result"

      - name: Collect recovery images
        if: success()
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for img in boot.img recovery.img vendor_boot.img; do
            file="$ANDROID_DIR/out/target/product/fog/$img"

            if [ -s "$file" ]; then
              cp -v "$file" "$GITHUB_WORKSPACE/artifacts/"
            fi
          done

          if ! compgen -G \
            "$GITHUB_WORKSPACE/artifacts/*.img" > /dev/null; then
            echo "ERROR: No recovery image generated"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum ./*.img > SHA256SUMS

      - name: Upload recovery images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-16.0-fog-UNTESTED
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Show disk usage
        if: always()
        run: |
          df -h
          free -h

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-fog-build-logs
          path: |
            repo-sync.log
            prebuilt.log
            build.log
          if-no-files-found: ignore
          retention-days: 7
